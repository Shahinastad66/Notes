<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفترچه یادداشت شخصی</title>
    <style>
        :root {
            --bg: #e0e5ec;
            --shadow-dark: #a3b1c6;
            --shadow-light: #ffffff;
            --text: #2d3e5f;
            --text-light: #6b7d95;
            --danger: #d15252;
            --success: #3a8f6a;
            --radius: 24px;
            --radius-sm: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            direction: rtl;
        }

        /* ============ CONTAINER ============ */
        .app-container {
            width: 100%;
            max-width: 600px;
            transition: all 0.3s ease;
        }

        /* ============ NEUMORPHIC BASE ============ */
        .neu-card {
            background: var(--bg);
            border-radius: 38px;
            box-shadow: 14px 14px 28px var(--shadow-dark), -14px -14px 28px var(--shadow-light);
            padding: 2rem;
            transition: box-shadow 0.3s;
        }

        .neu-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: none;
            background: var(--bg);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text);
            outline: none;
            box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light);
            transition: all 0.2s;
        }

        .neu-input:focus {
            box-shadow: inset 7px 7px 14px var(--shadow-dark), inset -7px -7px 14px var(--shadow-light);
        }

        .neu-input::placeholder {
            color: #8d9bb0;
        }

        .neu-btn {
            border: none;
            background: var(--bg);
            border-radius: var(--radius-sm);
            font-weight: bold;
            cursor: pointer;
            color: var(--text);
            box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
            transition: all 0.18s;
            letter-spacing: 0.5px;
        }

        .neu-btn:hover {
            box-shadow: 9px 9px 18px var(--shadow-dark), -9px -9px 18px var(--shadow-light);
            transform: translateY(-2px);
        }

        .neu-btn:active {
            box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
            transform: scale(0.96);
        }

        .neu-btn-sm {
            padding: 0.45rem 1rem;
            font-size: 0.8rem;
            border-radius: 40px;
            box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
        }

        .neu-btn-block {
            display: block;
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
        }

        /* ============ SECTIONS ============ */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeSlide 0.35s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ LOGIN PAGE ============ */
        .login-card {
            text-align: center;
            max-width: 380px;
            margin: 0 auto;
        }

        .login-card h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1.8rem;
            color: var(--text);
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #b7c1d4;
        }

        .login-card .neu-input {
            margin-bottom: 1.2rem;
        }

        .login-card .neu-btn {
            margin-top: 0.5rem;
        }

        .login-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.2rem;
            font-size: 0.75rem;
        }

        .login-links span {
            color: #3a5478;
            font-weight: 500;
            cursor: pointer;
            background: var(--bg);
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            transition: all 0.2s;
        }

        .login-links span:active {
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }

        .msg {
            font-size: 0.8rem;
            margin-top: 1rem;
            background: var(--bg);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            box-shadow: inset 1px 1px 3px var(--shadow-dark), inset -1px -1px 3px var(--shadow-light);
            min-height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
        }

        /* ============ NOTES PAGE ============ */
        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .notes-header .user-badge {
            font-size: 0.9rem;
            background: var(--bg);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            box-shadow: inset 2px 2px 6px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
            color: var(--text);
        }

        .note-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 7px 7px 16px var(--shadow-dark), -7px -7px 16px var(--shadow-light);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .note-card:hover {
            box-shadow: 10px 10px 22px var(--shadow-dark), -10px -10px 22px var(--shadow-light);
            transform: translateY(-2px);
        }

        .note-card h3 {
            color: var(--text);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .note-card .note-content {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 0.75rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-card .note-meta {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 0.75rem;
        }

        .note-card .note-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .empty-notes {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
            background: var(--bg);
            border-radius: var(--radius);
            box-shadow: inset 6px 6px 14px var(--shadow-dark), inset -6px -6px 14px var(--shadow-light);
        }

        .empty-notes .icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        /* ============ PAGINATION ============ */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .page-info {
            font-size: 0.85rem;
            background: var(--bg);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            box-shadow: inset 2px 2px 6px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h2 {
            color: var(--text);
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .modal .neu-input {
            margin-bottom: 1rem;
        }

        .modal textarea.neu-input {
            resize: vertical;
            min-height: 120px;
        }

        .modal .btn-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .neu-card {
                padding: 1.5rem;
                border-radius: 28px;
            }
            .login-card h1 {
                font-size: 1.8rem;
            }
            .note-card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ==================== LOGIN SECTION ==================== -->
    <section id="loginSection" class="section active">
        <div class="neu-card login-card">
            <h1>🔐 ورود</h1>
            <input type="text" class="neu-input" id="loginUsername" placeholder="نام کاربری" autocomplete="username">
            <input type="password" class="neu-input" id="loginPassword" placeholder="رمز عبور" autocomplete="current-password">
            <button class="neu-btn neu-btn-block" id="loginBtn">ورود به حساب</button>
            <div class="login-links">
                <span id="goToRegister">📝 ثبت‌نام</span>
                <span id="demoHint">🎯 demo / 123</span>
            </div>
            <div class="msg" id="loginMsg">👋 خوش آمدید! لطفاً وارد شوید.</div>
        </div>
    </section>

    <!-- ==================== REGISTER SECTION ==================== -->
    <section id="registerSection" class="section">
        <div class="neu-card login-card">
            <h1>📝 ثبت‌نام</h1>
            <input type="text" class="neu-input" id="regUsername" placeholder="نام کاربری">
            <input type="email" class="neu-input" id="regEmail" placeholder="ایمیل">
            <input type="password" class="neu-input" id="regPassword" placeholder="رمز عبور">
            <button class="neu-btn neu-btn-block" id="registerBtn">ایجاد حساب</button>
            <div class="login-links">
                <span id="goToLogin">🔐 قبلاً حساب دارم</span>
            </div>
            <div class="msg" id="regMsg">✨ یک حساب جدید بسازید.</div>
        </div>
    </section>

    <!-- ==================== NOTES SECTION ==================== -->
    <section id="notesSection" class="section">
        <div class="neu-card">
            <div class="notes-header">
                <span class="user-badge">👤 <strong id="displayUsername"></strong></span>
                <div style="display:flex; gap:0.5rem;">
                    <button class="neu-btn neu-btn-sm" id="addNoteBtn">➕ یادداشت جدید</button>
                    <button class="neu-btn neu-btn-sm" id="logoutBtn">🚪 خروج</button>
                </div>
            </div>
            <div id="notesList"></div>
            <div id="paginationContainer" class="pagination"></div>
        </div>
    </section>

</div>

<!-- ==================== MODAL ==================== -->
<div class="modal-overlay" id="noteModal">
    <div class="modal neu-card">
        <h2 id="modalTitle">یادداشت جدید</h2>
        <input type="text" class="neu-input" id="noteTitle" placeholder="عنوان یادداشت">
        <textarea class="neu-input" id="noteContent" placeholder="محتوای یادداشت..."></textarea>
        <div class="btn-row">
            <button class="neu-btn" id="saveNoteBtn" style="flex:1;">💾 ذخیره</button>
            <button class="neu-btn" id="cancelNoteBtn" style="flex:1;">❌ انصراف</button>
        </div>
    </div>
</div>

<script>
// ==================== API CONFIG ====================
const API_BASE = 'http://127.0.0.1:8000/api';
let accessToken = localStorage.getItem('accessToken') || null;
let refreshToken = localStorage.getItem('refreshToken') || null;
let currentUser = localStorage.getItem('currentUser') || null;
let currentPage = 1;
let editingNoteId = null;

// ==================== DOM ELEMENTS ====================
const loginSection = document.getElementById('loginSection');
const registerSection = document.getElementById('registerSection');
const notesSection = document.getElementById('notesSection');
const loginMsg = document.getElementById('loginMsg');
const regMsg = document.getElementById('regMsg');
const displayUsername = document.getElementById('displayUsername');
const notesList = document.getElementById('notesList');
const paginationContainer = document.getElementById('paginationContainer');
const noteModal = document.getElementById('noteModal');
const modalTitle = document.getElementById('modalTitle');
const noteTitle = document.getElementById('noteTitle');
const noteContent = document.getElementById('noteContent');

// ==================== HELPERS ====================
function showMessage(element, text, isError = false) {
    element.textContent = text;
    element.style.color = isError ? '#b13e3e' : '#3a8f6a';
    setTimeout(() => {
        element.style.color = '#2d3e5f';
    }, 3000);
}

function apiHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    if (accessToken) headers['Authorization'] = `Bearer ${accessToken}`;
    return headers;
}

async function apiFetch(url, options = {}) {
    let res = await fetch(url, options);
    if (res.status === 401 && refreshToken) {
        const refreshRes = await fetch(`${API_BASE}/user/token/refresh/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh: refreshToken })
        });
        if (refreshRes.ok) {
            const data = await refreshRes.json();
            accessToken = data.access;
            localStorage.setItem('accessToken', accessToken);
            options.headers['Authorization'] = `Bearer ${accessToken}`;
            res = await fetch(url, options);
        } else {
            logout();
            throw new Error('Session expired');
        }
    }
    return res;
}

function switchSection(section) {
    [loginSection, registerSection, notesSection].forEach(s => s.classList.remove('active'));
    section.classList.add('active');
}

function logout() {
    accessToken = null;
    refreshToken = null;
    currentUser = null;
    localStorage.clear();
    switchSection(loginSection);
}

// ==================== AUTH ====================
document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!username || !password) {
        showMessage(loginMsg, '⚠️ لطفاً نام کاربری و رمز عبور را وارد کنید.', true);
        return;
    }
    try {
        const res = await fetch(`${API_BASE}/user/token/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (res.ok) {
            const data = await res.json();
            accessToken = data.access;
            refreshToken = data.refresh;
            currentUser = username;
            localStorage.setItem('accessToken', accessToken);
            localStorage.setItem('refreshToken', refreshToken);
            localStorage.setItem('currentUser', currentUser);
            displayUsername.textContent = currentUser;
            switchSection(notesSection);
            currentPage = 1;
            loadNotes();
        } else {
            showMessage(loginMsg, '❌ نام کاربری یا رمز عبور اشتباه است.', true);
        }
    } catch (e) {
        showMessage(loginMsg, '❌ خطا در اتصال به سرور.', true);
    }
});

document.getElementById('registerBtn').addEventListener('click', async () => {
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    if (!username || !email || !password) {
        showMessage(regMsg, '⚠️ لطفاً همه فیلدها را پر کنید.', true);
        return;
    }
    try {
        const res = await fetch(`${API_BASE}/user/register/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        if (res.ok || res.status === 201) {
            showMessage(regMsg, '✅ ثبت‌نام موفق! حالا وارد شوید.', false);
            document.getElementById('regUsername').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            setTimeout(() => switchSection(loginSection), 1500);
        } else {
            const err = await res.json();
            showMessage(regMsg, `❌ ${JSON.stringify(err)}`, true);
        }
    } catch (e) {
        showMessage(regMsg, '❌ خطا در اتصال به سرور.', true);
    }
});

document.getElementById('goToRegister').addEventListener('click', () => switchSection(registerSection));
document.getElementById('goToLogin').addEventListener('click', () => switchSection(loginSection));
document.getElementById('demoHint').addEventListener('click', () => {
    document.getElementById('loginUsername').value = 'demo';
    document.getElementById('loginPassword').value = '123';
});

document.getElementById('logoutBtn').addEventListener('click', logout);

// ==================== NOTES CRUD ====================
async function loadNotes(page = 1) {
    currentPage = page;
    try {
        const res = await apiFetch(`${API_BASE}/notes/?page=${page}`, { headers: apiHeaders() });
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        renderNotes(data.results || []);
        renderPagination(data.count, page);
    } catch (e) {
        notesList.innerHTML = `<div class="empty-notes"><div class="icon">⚠️</div><p>خطا در بارگذاری یادداشت‌ها</p></div>`;
    }
}

function renderNotes(notes) {
    if (!notes.length) {
        notesList.innerHTML = `<div class="empty-notes"><div class="icon">📭</div><p>هنوز یادداشتی ندارید!</p><p style="font-size:0.8rem;">با دکمه ➕ اولین یادداشت رو بسازید.</p></div>`;
        paginationContainer.innerHTML = '';
        return;
    }
    notesList.innerHTML = notes.map(note => `
        <div class="note-card">
            <h3>${escapeHtml(note.title)}</h3>
            <div class="note-content">${escapeHtml(note.content)}</div>
            <div class="note-meta">📅 ${new Date(note.created_at).toLocaleDateString('fa-IR')} | 🕒 ${new Date(note.created_at).toLocaleTimeString('fa-IR')}</div>
            <div class="note-actions">
                <button class="neu-btn neu-btn-sm" onclick="editNote(${note.id}, '${escapeAttr(note.title)}', '${escapeAttr(note.content)}')">✏️ ویرایش</button>
                <button class="neu-btn neu-btn-sm" onclick="deleteNote(${note.id})" style="color:#b13e3e;">🗑️ حذف</button>
            </div>
        </div>
    `).join('');
}

function renderPagination(total, current) {
    const totalPages = Math.ceil(total / 10);
    if (totalPages <= 1) { paginationContainer.innerHTML = ''; return; }
    let html = '';
    html += `<button class="neu-btn neu-btn-sm" ${current === 1 ? 'disabled style="opacity:0.4;"' : ''} onclick="loadNotes(${current - 1})">⬅️ قبلی</button>`;
    html += `<span class="page-info">صفحه ${current} از ${totalPages}</span>`;
    html += `<button class="neu-btn neu-btn-sm" ${current === totalPages ? 'disabled style="opacity:0.4;"' : ''} onclick="loadNotes(${current + 1})">بعدی ➡️</button>`;
    paginationContainer.innerHTML = html;
}

function openModal(title = '', content = '', noteId = null) {
    editingNoteId = noteId;
    modalTitle.textContent = noteId ? '✏️ ویرایش یادداشت' : '✨ یادداشت جدید';
    noteTitle.value = title;
    noteContent.value = content;
    noteModal.classList.add('active');
    noteTitle.focus();
}

function closeModal() {
    noteModal.classList.remove('active');
    editingNoteId = null;
    noteTitle.value = '';
    noteContent.value = '';
}

document.getElementById('addNoteBtn').addEventListener('click', () => openModal());
document.getElementById('cancelNoteBtn').addEventListener('click', closeModal);
noteModal.addEventListener('click', (e) => { if (e.target === noteModal) closeModal(); });

document.getElementById('saveNoteBtn').addEventListener('click', async () => {
    const title = noteTitle.value.trim();
    const content = noteContent.value.trim();
    if (!title || !content) return alert('عنوان و محتوا الزامی است.');
    const body = JSON.stringify({ title, content });
    const url = editingNoteId ? `${API_BASE}/notes/${editingNoteId}/` : `${API_BASE}/notes/`;
    const method = editingNoteId ? 'PUT' : 'POST';
    try {
        const res = await apiFetch(url, { method, headers: apiHeaders(), body });
        if (res.ok || res.status === 201) {
            closeModal();
            loadNotes(currentPage);
        } else {
            alert('❌ خطا در ذخیره یادداشت.');
        }
    } catch (e) {
        alert('❌ خطا در اتصال به سرور.');
    }
});

function editNote(id, title, content) {
    openModal(title, content, id);
}

async function deleteNote(id) {
    if (!confirm('آیا از حذف این یادداشت مطمئن هستید؟')) return;
    try {
        const res = await apiFetch(`${API_BASE}/notes/${id}/`, { method: 'DELETE', headers: apiHeaders() });
        if (res.ok || res.status === 204) {
            loadNotes(currentPage);
        } else {
            alert('❌ خطا در حذف یادداشت.');
        }
    } catch (e) {
        alert('❌ خطا در اتصال به سرور.');
    }
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function escapeAttr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ==================== KEYBOARD SHORTCUTS ====================
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.activeElement === document.getElementById('loginPassword')) {
        document.getElementById('loginBtn').click();
    }
    if (e.key === 'Enter' && document.activeElement === document.getElementById('regPassword')) {
        document.getElementById('registerBtn').click();
    }
});

// ==================== INIT ====================
if (accessToken && currentUser) {
    displayUsername.textContent = currentUser;
    switchSection(notesSection);
    loadNotes();
}
</script>

</body>
</html>
